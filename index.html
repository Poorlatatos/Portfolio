<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #startScreen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: black;
            z-index: 2;
            cursor: pointer;
        }

        #startImage {
            width: min(320px, 70vw);
            height: auto;
            display: block;
        }

        #bgvid {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            transform: scale(0.7);
            transform-origin: center center;
            display: none;
        }
    </style>
</head>
<body>
    <div id="startScreen" aria-label="Start video">
        <img id="startImage" src="./imgs/Start.png" alt="Start">
    </div>

    <video id="bgvid" playsinline preload="auto">
        <source src="./video_files/GardenSceneOpening.mp4" type="video/mp4">
    </video>

    <script>
        const startScreen = document.getElementById('startScreen');
        const introVideo = document.getElementById('bgvid');

        startScreen.addEventListener('click', async () => {
            startScreen.style.display = 'none';
            introVideo.style.display = 'block';

            try {
                await introVideo.play();
            } catch (error) {
                console.error('Video playback failed:', error);
            }
        });

        introVideo.addEventListener('ended', () => {
            window.location.href = 'applegarden.html';
        });
    </script>
</body>
</html>
